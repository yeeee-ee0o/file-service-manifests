apiVersion: v1
kind: Pod
metadata:
  name: file-service-solo
  labels:
    app.kubernetes.io/name: file-service-solo
spec:
  containers:
    - name: app
      image: superbdevops/file-service:1.3.0
      ports:
        - containerPort: 8080
      env:
        - name: SPRING_PROFILES_ACTIVE
          value: local
      volumeMounts:
        - name: data
          mountPath: /app/data
  volumes:
    - name: data
      emptyDir: {}
