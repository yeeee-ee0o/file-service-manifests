apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml

labels:
  - includeSelectors: false
    pairs:
      environment: local

images:
  - name: superbdevops/file-service
    newTag: "1.3.0"

patches:
  - target:
      kind: Deployment
      name: file-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
